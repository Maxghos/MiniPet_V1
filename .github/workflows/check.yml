name: Firmware y comportamiento
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: ${{ runner.temp }}/minipet-android-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Temporary debug signing key (never uploaded)
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          if [ ! -f "$ANDROID_USER_HOME/debug.keystore" ]; then
            keytool -genkeypair -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=MiniPet Debug,O=MiniPet,C=CL" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Verify app and build an untracked test APK
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: APK files must never be tracked
        run: test -z "$(git ls-files '*.apk' '*.aab' '*.jks' '*.keystore')"
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/*.json') }}
      - run: pip install -r tools/requirements.txt
      - run: pio pkg install -e esp32s3
      - run: bash tools/test_host.sh
      - run: pio run -e esp32s3 -e esp32s3-button
      - run: bash tools/preview.sh
      - run: node tools/test_preview.js
      - uses: actions/upload-artifact@v4
        with:
          name: minipet-firmware-y-caras
          path: |
            .pio/build/esp32s3/firmware.bin
            .pio/build/esp32s3/bootloader.bin
            .pio/build/esp32s3/partitions.bin
            .pio/build/esp32s3-button/firmware.bin
            docs/caras.html
